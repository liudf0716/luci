<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Optimized gradients for 48px -->
    <linearGradient id="primary48" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Glass effect for small size -->
    <radialGradient id="glass48" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </radialGradient>
    
    <!-- Compact shadow -->
    <filter id="shadow48" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Subtle glow -->
    <filter id="glow48" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with glass effect -->
  <circle cx="24" cy="24" r="22" 
          fill="url(#glass48)" 
          stroke="rgba(255,255,255,0.2)" 
          stroke-width="0.5" 
          filter="url(#shadow48)"/>
  
  <!-- Central hub - larger for visibility -->
  <circle cx="24" cy="24" r="7" 
          fill="url(#primary48)" 
          filter="url(#glow48)"/>
  
  <!-- Primary network nodes - 4 main directions -->
  <g fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5">
    <circle cx="24" cy="8" r="2.5"/>   <!-- Top -->
    <circle cx="40" cy="24" r="2.5"/>  <!-- Right -->
    <circle cx="24" cy="40" r="2.5"/>  <!-- Bottom -->
    <circle cx="8" cy="24" r="2.5"/>   <!-- Left -->
  </g>
  
  <!-- Secondary nodes - diagonal positions -->
  <g fill="rgba(255,255,255,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="0.3">
    <circle cx="35" cy="13" r="1.5"/>  <!-- Top-right -->
    <circle cx="35" cy="35" r="1.5"/>  <!-- Bottom-right -->
    <circle cx="13" cy="35" r="1.5"/>  <!-- Bottom-left -->
    <circle cx="13" cy="13" r="1.5"/>  <!-- Top-left -->
  </g>
  
  <!-- Connection lines from center to primary nodes -->
  <g stroke="url(#primary48)" stroke-width="1.2" fill="none" opacity="0.7" stroke-linecap="round">
    <line x1="24" y1="24" x2="24" y2="8"/>   <!-- To top -->
    <line x1="24" y1="24" x2="40" y2="24"/>  <!-- To right -->
    <line x1="24" y1="24" x2="24" y2="40"/>  <!-- To bottom -->
    <line x1="24" y1="24" x2="8" y2="24"/>   <!-- To left -->
  </g>
  
  <!-- Secondary connections to diagonal nodes -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round">
    <line x1="24" y1="24" x2="35" y2="13"/>
    <line x1="24" y1="24" x2="35" y2="35"/>
    <line x1="24" y1="24" x2="13" y2="35"/>
    <line x1="24" y1="24" x2="13" y2="13"/>
  </g>
  
  <!-- Outer ring connections -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round">
    <path d="M 24 8 A 11.3 11.3 0 0 1 40 24"/>      <!-- Top to right arc -->
    <path d="M 40 24 A 11.3 11.3 0 0 1 24 40"/>     <!-- Right to bottom arc -->
    <path d="M 24 40 A 11.3 11.3 0 0 1 8 24"/>      <!-- Bottom to left arc -->
    <path d="M 8 24 A 11.3 11.3 0 0 1 24 8"/>       <!-- Left to top arc -->
  </g>
  
  <!-- Glass highlight - positioned for 48px -->
  <ellipse cx="19" cy="17" rx="6" ry="3" 
           fill="rgba(255,255,255,0.2)" 
           transform="rotate(-30 19 17)"/>
  
  <!-- Central highlight dot -->
  <circle cx="24" cy="24" r="1.5" 
          fill="rgba(255,255,255,0.9)" 
          opacity="0.8"/>
  
  <!-- Outer subtle glow ring -->
  <circle cx="24" cy="24" r="21" 
          fill="none" 
          stroke="rgba(233, 69, 96, 0.1)" 
          stroke-width="0.5" 
          opacity="0.6"/>
</svg>