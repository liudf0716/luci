<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- ChaWrt primary gradient -->
    <linearGradient id="chaWrtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#9333ea" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#e94560" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Glass effect for logo -->
    <radialGradient id="logoGlass" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </radialGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#e94560" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>
    
    <!-- Text shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Logo background blur -->
    <filter id="bgBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  
  <!-- Background glass panel -->
  <rect x="2" y="2" width="196" height="56" rx="12" ry="12" 
        fill="rgba(255,255,255,0.08)" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="0.5"
        filter="url(#bgBlur)"/>
  
  <!-- Logo icon (network/router symbol) -->
  <g transform="translate(15, 12)">
    <!-- Central hub -->
    <circle cx="18" cy="18" r="6" fill="url(#chaWrtGradient)" filter="url(#glow)"/>
    <circle cx="18" cy="18" r="6" fill="url(#logoGlass)" opacity="0.7"/>
    
    <!-- Network nodes -->
    <circle cx="6" cy="6" r="3" fill="url(#chaWrtGradient)" opacity="0.8"/>
    <circle cx="30" cy="6" r="3" fill="url(#chaWrtGradient)" opacity="0.8"/>
    <circle cx="6" cy="30" r="3" fill="url(#chaWrtGradient)" opacity="0.8"/>
    <circle cx="30" cy="30" r="3" fill="url(#chaWrtGradient)" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="18" y1="12" x2="18" y2="6" stroke="url(#chaWrtGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="24" y1="18" x2="30" y2="18" stroke="url(#chaWrtGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="18" y1="24" x2="18" y2="30" stroke="url(#chaWrtGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="12" y1="18" x2="6" y2="18" stroke="url(#chaWrtGradient)" stroke-width="2" opacity="0.7"/>
    
    <!-- Diagonal connections -->
    <line x1="13" y1="13" x2="9" y2="9" stroke="url(#chaWrtGradient)" stroke-width="1.5" opacity="0.5"/>
    <line x1="23" y1="13" x2="27" y2="9" stroke="url(#chaWrtGradient)" stroke-width="1.5" opacity="0.5"/>
    <line x1="13" y1="23" x2="9" y2="27" stroke="url(#chaWrtGradient)" stroke-width="1.5" opacity="0.5"/>
    <line x1="23" y1="23" x2="27" y2="27" stroke="url(#chaWrtGradient)" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Center highlight -->
    <circle cx="18" cy="18" r="2" fill="rgba(255,255,255,0.8)" opacity="0.9"/>
  </g>
  
  <!-- ChaWrt Text -->
  <g transform="translate(75, 35)" filter="url(#textShadow)">
    <!-- Cha text -->
    <text x="0" y="0" 
          font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" 
          font-size="24" 
          font-weight="700" 
          fill="url(#textGradient)"
          letter-spacing="0.5px">Cha</text>
    
    <!-- Wrt text -->  
    <text x="52" y="0" 
          font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" 
          font-size="24" 
          font-weight="300" 
          fill="url(#textGradient)"
          letter-spacing="0.3px">Wrt</text>
          
    <!-- Subtitle -->
    <text x="0" y="12" 
          font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" 
          font-size="8" 
          font-weight="400" 
          fill="rgba(255,255,255,0.6)"
          letter-spacing="0.8px">WIRELESS ROUTER</text>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.3">
    <!-- Top accent line -->
    <line x1="15" y1="8" x2="185" y2="8" 
          stroke="url(#chaWrtGradient)" 
          stroke-width="0.5" 
          opacity="0.6"/>
    
    <!-- Bottom accent line -->
    <line x1="15" y1="52" x2="185" y2="52" 
          stroke="url(#chaWrtGradient)" 
          stroke-width="0.5" 
          opacity="0.6"/>
  </g>
  
  <!-- Glass overlay effect -->
  <rect x="2" y="2" width="196" height="28" rx="12" ry="12" 
        fill="url(#logoGlass)" 
        opacity="0.15"/>
        
  <!-- Animated pulse effect -->
  <circle cx="33" cy="30" r="8" 
          fill="none" 
          stroke="url(#chaWrtGradient)" 
          stroke-width="0.5" 
          opacity="0.4">
    <animate attributeName="r" 
             values="8;12;8" 
             dur="3s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.4;0.1;0.4" 
             dur="3s" 
             repeatCount="indefinite"/>
  </circle>
</svg>