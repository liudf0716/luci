<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- 注销图标渐变 -->
    <linearGradient id="logoutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e94560" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#202124" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- 玻璃光效 -->
    <radialGradient id="logoutGlass" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 发光效果 -->
    <filter id="logoutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ef4444" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g filter="url(#logoutGlow)">
    <!-- 门框（右侧） -->
    <path fill="url(#logoutGradient)" 
          d="M19,3H5c-1.11,0,-2,0.9,-2,2v4h2V5h14v14H5v-4H3v4c0,1.1,0.89,2,2,2h14c1.1,0,2,-0.9,2,-2V5c0,-1.1,-0.9,-2,-2,-2z">
      
      <!-- 门框闪烁效果 -->
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- 箭头和线条 -->
    <g>
      <!-- 箭头 -->
      <path fill="url(#logoutGradient)"
            d="M10.09,15.59L11.5,17l5,-5,-5,-5,-1.41,1.41L12.67,11H3v2h9.67l-2.58,2.59z">
        
        <!-- 箭头移动动画 -->
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0,0;2,0;0,0"
          dur="2s"
          repeatCount="indefinite"/>
      </path>
      
      <!-- 箭头高光 -->
      <path fill="url(#logoutGlass)" opacity="0.6"
            d="M10.09,15.59L11.5,17l5,-5,-5,-5,-1.41,1.41L12.67,11H3v2h9.67l-2.58,2.59z"/>
    </g>
    
    <!-- 整体玻璃覆盖层 -->
    <rect x="3" y="5" width="16" height="14" rx="2" fill="none" 
          stroke="rgba(255,255,255,0.15)" stroke-width="0.5" opacity="0.5"/>
  </g>
</svg>