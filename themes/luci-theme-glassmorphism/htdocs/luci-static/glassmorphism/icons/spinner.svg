<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <!-- Glassmorphism渐变效果 -->
    <linearGradient id="spinnerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </linearGradient>
    
    <!-- 玻璃光效 -->
    <radialGradient id="spinnerGlass" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </radialGradient>

    <!-- 旋转动画 -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 8 8;360 8 8" 
      dur="1s" 
      repeatCount="indefinite" 
      id="spinAnimation"/>
  </defs>
  
  <!-- 主要旋转元素 -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0 8 8;360 8 8" 
      dur="1s" 
      repeatCount="indefinite"/>
    
    <!-- 加载环 -->
    <path fill="url(#spinnerGradient)" 
          d="M8,0c-4.355,0-7.898,3.481-7.998,7.812,0.092-3.779,2.966-6.812,6.498-6.812,3.59,0,6.5,3.134,6.5,7,0,0.828,0.672,1.5,1.5,1.5s1.5-0.672,1.5-1.5c0-4.418-3.582-8-8-8z"/>
    
    <!-- 底部环（较淡） -->
    <path fill="url(#spinnerGlass)" 
          d="M8,16c4.355,0,7.898-3.481,7.998-7.812-0.092,3.779-2.966,6.812-6.498,6.812-3.59,0-6.5-3.134-6.5-7,0-0.828-0.672-1.5-1.5-1.5s-1.5,0.672-1.5,1.5c0,4.418,3.582,8,8,8z"/>
    
    <!-- 中心高光点 -->
    <circle cx="8" cy="8" r="1.5" fill="rgba(255,255,255,0.8)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>