<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <!-- Compact gradient -->
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    
    <!-- Glass effect -->
    <linearGradient id="glass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="24" cy="24" r="22" 
          fill="url(#glass)" 
          stroke="rgba(255,255,255,0.2)" 
          stroke-width="0.5" 
          filter="url(#shadow)"/>
  
  <!-- Central hub -->
  <circle cx="24" cy="24" r="6" fill="url(#primary)"/>
  
  <!-- Primary nodes -->
  <g fill="rgba(255,255,255,0.9)">
    <circle cx="24" cy="10" r="2"/>
    <circle cx="38" cy="24" r="2"/>
    <circle cx="24" cy="38" r="2"/>
    <circle cx="10" cy="24" r="2"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="url(#primary)" stroke-width="1" opacity="0.6" stroke-linecap="round">
    <line x1="24" y1="24" x2="24" y2="10"/>
    <line x1="24" y1="24" x2="38" y2="24"/>
    <line x1="24" y1="24" x2="24" y2="38"/>
    <line x1="24" y1="24" x2="10" y2="24"/>
  </g>
  
  <!-- Glass highlight -->
  <ellipse cx="20" cy="18" rx="5" ry="2.5" 
           fill="rgba(255,255,255,0.2)" 
           transform="rotate(-20 20 18)"/>
  
  <!-- Center highlight -->
  <circle cx="24" cy="24" r="1" fill="rgba(255,255,255,0.8)"/>
</svg>