<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <!-- Compact ChaWrt gradient -->
    <linearGradient id="compactGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85"/>
    </linearGradient>
    
    <!-- Compact text gradient -->
    <linearGradient id="compactTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Compact glow -->
    <filter id="compactGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#e94560" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="1" y="1" width="118" height="38" rx="8" ry="8" 
        fill="rgba(255,255,255,0.05)" 
        stroke="rgba(255,255,255,0.15)" 
        stroke-width="0.5"/>
  
  <!-- Simplified logo -->
  <g transform="translate(8, 12)">
    <!-- Central hub -->
    <circle cx="8" cy="8" r="4" fill="url(#compactGradient)" filter="url(#compactGlow)"/>
    <!-- Corner nodes -->
    <circle cx="2" cy="2" r="1.5" fill="url(#compactGradient)" opacity="0.7"/>
    <circle cx="14" cy="2" r="1.5" fill="url(#compactGradient)" opacity="0.7"/>
    <circle cx="2" cy="14" r="1.5" fill="url(#compactGradient)" opacity="0.7"/>
    <circle cx="14" cy="14" r="1.5" fill="url(#compactGradient)" opacity="0.7"/>
    <!-- Center highlight -->
    <circle cx="8" cy="8" r="1" fill="rgba(255,255,255,0.8)"/>
  </g>
  
  <!-- ChaWrt text -->
  <g transform="translate(35, 25)">
    <text x="0" y="0" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="16" 
          font-weight="600" 
          fill="url(#compactTextGradient)"
          letter-spacing="0.3px">ChaWrt</text>
  </g>
</svg>