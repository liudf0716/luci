<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Primary gradient -->
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.7"/>
    </linearGradient>
    
    <!-- Glass gradient -->
    <linearGradient id="glass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Blur filter -->
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  
  <!-- Background circle with glassmorphism effect -->
  <circle cx="50" cy="50" r="46" 
          fill="url(#glass)" 
          stroke="rgba(255,255,255,0.15)" 
          stroke-width="0.5" 
          filter="url(#shadow)"/>
  
  <!-- Central hub -->
  <circle cx="50" cy="50" r="12" 
          fill="url(#primary)" 
          opacity="0.95"/>
  
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="26" 
          fill="none" 
          stroke="url(#primary)" 
          stroke-width="1.5" 
          opacity="0.6"/>
  
  <!-- Network nodes -->
  <g fill="rgba(255,255,255,0.8)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5">
    <circle cx="50" cy="24" r="3.5"/>
    <circle cx="76" cy="50" r="3.5"/>
    <circle cx="50" cy="76" r="3.5"/>
    <circle cx="24" cy="50" r="3.5"/>
    <circle cx="39" cy="32" r="2.5"/>
    <circle cx="68" cy="32" r="2.5"/>
    <circle cx="68" cy="68" r="2.5"/>
    <circle cx="32" cy="68" r="2.5"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="url(#primary)" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="24"/>
    <line x1="50" y1="50" x2="76" y2="50"/>
    <line x1="50" y1="50" x2="50" y2="76"/>
    <line x1="50" y1="50" x2="24" y2="50"/>
    <line x1="50" y1="50" x2="39" y2="32"/>
    <line x1="50" y1="50" x2="68" y2="32"/>
    <line x1="50" y1="50" x2="68" y2="68"/>
    <line x1="50" y1="50" x2="32" y2="68"/>
  </g>
  
  <!-- Curved connections between outer nodes -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 50 24 A 18 18 0 0 1 76 50"/>
    <path d="M 76 50 A 18 18 0 0 1 50 76"/>
    <path d="M 50 76 A 18 18 0 0 1 24 50"/>
    <path d="M 24 50 A 18 18 0 0 1 50 24"/>
  </g>
  
  <!-- Glass highlight -->
  <ellipse cx="42" cy="38" rx="12" ry="6" 
           fill="rgba(255,255,255,0.15)" 
           filter="url(#blur)" 
           transform="rotate(-25 42 38)"/>
  
  <!-- Outer glow -->
  <circle cx="50" cy="50" r="40" 
          fill="url(#glow)" 
          opacity="0.5"/>
          
  <!-- Central highlight dot -->
  <circle cx="50" cy="50" r="2" 
          fill="rgba(255,255,255,0.9)"/>
</svg>